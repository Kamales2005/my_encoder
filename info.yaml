# Tiny Tapeout project information
project:
  title: "8-bit Priority Encoder"
  author: "Kamales D"
  discord: ""
  description: "An 8-bit combinational priority encoder."
  language: "Verilog"
  clock_hz: 0

  tiles: "1x1"

  top_module: "tt_um_kamales_encoder"

  source_files:
    - "project.v"

pinout:
  # Inputs
  ui[0]: "Input bit 0"
  ui[1]: "Input bit 1"
  ui[2]: "Input bit 2"
  ui[3]: "Input bit 3"
  ui[4]: "Input bit 4"
  ui[5]: "Input bit 5"
  ui[6]: "Input bit 6"
  ui[7]: "Input bit 7"

  # Outputs
  uo[0]: "Encoded output bit 0"
  uo[1]: "Encoded output bit 1"
  uo[2]: "Encoded output bit 2"
  uo[3]: "Encoded output bit 3"
  uo[4]: "Output bit 4"
  uo[5]: "Output bit 5"
  uo[6]: "Output bit 6"
  uo[7]: "Output bit 7"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
